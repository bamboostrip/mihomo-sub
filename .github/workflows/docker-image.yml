name: Build and Push mihomo-sub Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set IMAGE_TAG
      id: tag
      run: |
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        BUILD_DATE=$(date +%Y%m%d)
        if git describe --tags --exact-match HEAD 2>/dev/null; then
          GIT_TAG=$(git describe --tags --exact-match HEAD)
          IMAGE_TAG="${GIT_TAG}"
        else
          IMAGE_TAG="${BUILD_DATE}-${SHORT_SHA}"
        fi
        echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
        echo "构建标签: ${IMAGE_TAG}"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # PR 仅构建验证，不推送
    - name: Build (PR check only)
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: false

    # push/main 分支：登录并推送多架构镜像
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Build and push multi-arch image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
        push: true
        tags: |
          lsw951753/mihomo-sub:${{ env.IMAGE_TAG }}
          lsw951753/mihomo-sub:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Sync README to Docker Hub
      if: github.event_name != 'pull_request'
      run: |
        TOKEN=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
          -H "Content-Type: application/json" \
          -d "{\"username\":\"${{ secrets.DOCKER_HUB_USERNAME }}\",\"password\":\"${{ secrets.DOCKER_HUB_PASSWORD }}\"}" | jq -r .token)
        if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
          echo "Docker Hub 登录失败，跳过 README 同步"
          exit 0
        fi
        jq -Rs '.' README.md > /tmp/readme.json
        curl -s -X PATCH https://hub.docker.com/v2/repositories/lsw951753/mihomo-sub/ \
          -H "Content-Type: application/json" \
          -H "Authorization: JWT ${TOKEN}" \
          -d "{\"full_description\":$(cat /tmp/readme.json)}"
        echo "README 同步完成"
