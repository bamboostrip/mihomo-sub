<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mihomo 订阅管理</title>
<style>
:root {
    --bg: #1a1b2e;
    --card: #232540;
    --border: #2e3058;
    --text: #e0e0e8;
    --text-dim: #8888a0;
    --accent: #6c7bff;
    --accent-hover: #8290ff;
    --danger: #e0556a;
    --danger-hover: #f06070;
    --success: #4caf88;
    --warning: #e0a840;
    --radius: 12px;
    --radius-sm: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px;
    min-height: 100vh;
}
h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
}
.card-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
}
.status-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
}
.status-item {
    flex: 1;
    min-width: 120px;
}
.status-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 2px;
}
.status-value {
    font-size: 1rem;
    font-weight: 500;
}
.status-ok { color: var(--success); }
.status-warn { color: var(--warning); }

.sub-list { list-style: none; }
.sub-item {
    display: block;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
}
.sub-item:last-child { border-bottom: none; }
.sub-row {
    display: flex;
    align-items: center;
    gap: 10px;
}
.sub-url {
    flex: 1;
    font-size: 0.85rem;
    word-break: break-all;
    color: var(--text);
    background: var(--bg);
    padding: 6px 10px;
    border-radius: var(--radius-sm);
}
.sub-alias {
    flex-shrink: 0;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
}
.sub-edit {
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.8rem;
    white-space: nowrap;
    transition: all 0.15s;
}
.sub-edit:hover {
    background: var(--accent);
    color: #fff;
}

.use-bar {
    height: 4px;
    background: var(--bg);
    border-radius: 2px;
    margin: 8px 0 4px;
    overflow: hidden;
}
.use-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
}
.use-text {
    font-size: 0.72rem;
    color: var(--text-dim);
}
.sub-del {
    background: none;
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.8rem;
    white-space: nowrap;
    transition: all 0.15s;
}
.sub-del:hover {
    background: var(--danger);
    color: #fff;
}

.sub-enable {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
}
.sub-solo {
    background: none;
    border: 1px solid var(--warning);
    color: var(--warning);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.8rem;
    white-space: nowrap;
    transition: all 0.15s;
}
.sub-solo:hover {
    background: var(--warning);
    color: #fff;
}
.sub-item.disabled .sub-url { opacity: 0.55; }
.sub-offtag {
    flex-shrink: 0;
    font-size: 0.72rem;
    color: var(--text-dim);
    border: 1px dashed var(--border);
    padding: 3px 8px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
}

.add-form {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}
.add-input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text);
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.15s;
}
.add-input:focus { border-color: var(--accent); }
.add-input::placeholder { color: var(--text-dim); }

.btn {
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
}
.btn-primary { background: var(--accent); color: #fff; flex-shrink: 0; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-outline {
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
}
.btn-outline:hover { background: var(--accent); color: #fff; }

.schedule-options { display: flex; gap: 10px; }
.schedule-opt {
    flex: 1;
    text-align: center;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.15s;
}
.schedule-opt:hover { border-color: var(--accent); }
.schedule-opt.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
}
.schedule-opt.disabled {
    opacity: 0.45;
    pointer-events: none;
    cursor: not-allowed;
}

.action-row { display: flex; gap: 10px; }
.action-row .btn { flex:1; text-align:center; }

.log-viewer {
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 12px;
    max-height: 280px;
    overflow-y: auto;
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.75rem;
    line-height: 1.6;
    color: var(--text-dim);
    white-space: pre-wrap;
    word-break: break-all;
}

.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 24px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    z-index: 999;
    animation: fadeIn 0.2s;
}
.toast-success { background: var(--success); color: #fff; }
.toast-error { background: var(--danger); color: #fff; }
@keyframes fadeIn { from {opacity:0; transform:translateX(-50%) translateY(10px);} }

.refreshing, .btn:disabled { opacity: 0.5; pointer-events: none; cursor: not-allowed; }
.spin {
    display: inline-block;
    animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-state {
    text-align: center;
    padding: 20px;
    color: var(--text-dim);
    font-size: 0.85rem;
}
</style>
</head>
<body>

<h1>⚡ Mihomo 订阅管理</h1>

<!-- 状态卡片 -->
<div class="card">
    <div class="card-title">运行状态</div>
    <div class="status-row">
        <div class="status-item">
            <div class="status-label">最后刷新</div>
            <div class="status-value" id="lastRun">-</div>
        </div>
        <div class="status-item">
            <div class="status-label">定时调度</div>
            <div class="status-value" id="scheduleDisplay">-</div>
        </div>
        <div class="status-item">
            <div class="status-label">订阅数量</div>
            <div class="status-value" id="subCount">0</div>
        </div>
    </div>
</div>

<!-- 订阅列表卡片 -->
<div class="card" id="subCard">
    <div class="card-title">订阅列表</div>
    <ul class="sub-list" id="subList"></ul>
    <div class="add-form">
        <input class="add-input" id="aliasInput" placeholder="别名（可选，如：主账号）" autocomplete="off" maxlength="24" style="flex:0 0 130px;">
        <input class="add-input" id="subInput" placeholder="输入订阅 URL（http:// 或 https://）" autocomplete="off">
        <button class="btn btn-primary" onclick="addSub()">＋ 添加</button>
    </div>
    <div class="use-text" style="margin-top:10px">勾选框控制启用/停用（可多选合并）；「切换」= 只用这一个订阅（Verge 式切换，自动刷新）。改动刷新后生效。</div>
</div>

<!-- 调度设置卡片 -->
<div class="card">
    <div class="card-title">定时刷新</div>
    <div class="schedule-options" id="scheduleOpts">
        <div class="schedule-opt" data-val="15min" onclick="setSchedule('15min')">每 15 分钟</div>
        <div class="schedule-opt" data-val="hourly" onclick="setSchedule('hourly')">每小时</div>
        <div class="schedule-opt" data-val="daily" onclick="setSchedule('daily')">每天</div>
    </div>
</div>

<!-- 多账号合并方式卡片 -->
<div class="card">
    <div class="card-title">多账号合并方式</div>
    <div class="schedule-options" id="groupModeOpts">
        <div class="schedule-opt" data-val="merge" onclick="setGroupMode('merge')">合并策略组（推荐）</div>
        <div class="schedule-opt" data-val="isolate" onclick="setGroupMode('isolate')">按账号隔离</div>
    </div>
    <div class="use-text" id="groupModeHint" style="margin-top:10px"></div>
</div>

<!-- TUN 全局代理卡片 -->
<div class="card">
    <div class="card-title">TUN 全局代理</div>
    <div class="schedule-options" id="tunModeOpts">
        <div class="schedule-opt" data-val="off" onclick="setTunMode('off')">关闭</div>
        <div class="schedule-opt" data-val="on" onclick="setTunMode('on')">开启</div>
    </div>
    <div class="use-text" id="tunModeHint" style="margin-top:10px"></div>
</div>

<!-- 操作按钮 -->
<div class="card">
    <div class="action-row">
        <button class="btn btn-primary" id="refreshBtn" onclick="doRefresh()">
            <span id="refreshIcon">🔄</span><span class="btn-text"> 立即刷新</span>
        </button>
        <button class="btn btn-outline" onclick="openPanel()">📊 打开面板</button>
    </div>
</div>

<!-- 日志卡片 -->
<div class="card">
    <div class="card-title">最近日志</div>
    <div class="log-viewer" id="logViewer">加载中...</div>
</div>

<script>
const API = '/cgi-bin/api';

async function api(action, method, body) {
    let url = API + '?action=' + action;
    let opts = { method: method || 'GET' };
    if (body) {
        opts.method = 'POST';
        opts.headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
        opts.body = body;
    }
    try {
        let res = await fetch(url, opts);
        return await res.json();
    } catch(e) {
        return { error: '网络请求失败: ' + e.message };
    }
}

function toast(msg, ok) {
    let t = document.createElement('div');
    t.className = 'toast ' + (ok ? 'toast-success' : 'toast-error');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

// 加载状态
async function loadStatus() {
    let s = await api('status');
    document.getElementById('lastRun').textContent = s.last_run || '无记录';
    document.getElementById('subCount').textContent = s.sub_count || 0;
    let schMap = { '15min': '每 15 分钟', 'hourly': '每小时', 'daily': '每天' };
    document.getElementById('scheduleDisplay').textContent = schMap[s.schedule] || s.schedule || '-';
}

// 加载订阅列表
async function loadSubs() {
    let data = await api('list');
    let list = document.getElementById('subList');
    list.innerHTML = '';
    if (!data.subscriptions || data.subscriptions.length === 0) {
        list.innerHTML = '<div class="empty-state">暂无订阅，请在上方添加</div>';
        return;
    }
    data.subscriptions.forEach(s => {
        // 兼容老数据：字符串，或 {url, alias, enabled} 对象
        let url = (s && s.url) || s;
        let alias = (s && s.alias) || '';
        let enabled = !(s && s.enabled === false);
        let li = document.createElement('li');
        li.className = 'sub-item' + (enabled ? '' : ' disabled');
        let badge = alias ? '<span class="sub-alias">' + escHtml(alias) + '</span>' : '';
        let offTag = enabled ? '' : '<span class="sub-offtag">已停用</span>';
        li.innerHTML =
            '<div class="sub-row">' +
            '<input type="checkbox" class="sub-enable" title="启用/停用（可多选合并）"' + (enabled ? ' checked' : '') + '>' +
            badge + offTag +
            '<span class="sub-url">' + escHtml(url) + '</span>' +
            '<button class="sub-solo" title="只用这一个订阅（停用其他），自动刷新">切换</button>' +
            '<button class="sub-edit" onclick="renSub(this)">改名</button>' +
            '<button class="sub-del" onclick="delSub(this)">删除</button>' +
            '</div><div class="sub-use"></div>';
        li.querySelector('.sub-enable').addEventListener('change', function() {
            toggleSub(url, this.checked);
        });
        li.querySelector('.sub-solo').addEventListener('click', function() {
            soloSub(url);
        });
        li.querySelector('.sub-del').dataset.url = url;
        li.querySelector('.sub-edit').dataset.url = url;
        li.querySelector('.sub-edit').dataset.alias = alias;
        list.appendChild(li);
    });
    loadStatus();
    loadUsage();
}

function escHtml(s) {
    let d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function fmtBytes(b) {
    if (!b) return '0 MB';
    let gb = b / 1073741824;
    if (gb >= 1) return gb.toFixed(1) + ' GB';
    return (b / 1048576).toFixed(1) + ' MB';
}

// 加载各订阅流量（Verge 式的剩余额度条）
async function loadUsage() {
    let data = await api('usage');
    if (!data.usage) return;
    let map = {};
    data.usage.forEach(u => { map[u.url] = u; });
    document.querySelectorAll('#subList .sub-item').forEach(li => {
        let box = li.querySelector('.sub-use');
        if (!box) return;
        let url = li.querySelector('.sub-del').dataset.url;
        let u = map[url];
        if (!u || (!u.upload && !u.download && !u.total)) {
            box.innerHTML = '<div class="use-text">流量信息暂无（下次刷新后显示）</div>';
            return;
        }
        let used = (u.upload || 0) + (u.download || 0);
        let pct = u.total > 0 ? Math.min(100, used / u.total * 100) : 0;
        let exp = u.expire > 0 ? ' · 到期 ' + new Date(u.expire * 1000).toLocaleDateString() : '';
        let totalTxt = u.total > 0 ? ' / ' + fmtBytes(u.total) : '（不限量）';
        box.innerHTML =
            '<div class="use-bar"><div class="use-fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +
            '<div class="use-text">已用 ' + fmtBytes(used) + totalTxt + exp + '</div>';
    });
}

// 添加订阅（可带别名，别名会作为节点名前缀用于区分流量归属）
async function addSub() {
    let input = document.getElementById('subInput');
    let aliasInput = document.getElementById('aliasInput');
    let url = input.value.trim();
    let alias = aliasInput.value.trim();
    if (!url) { toast('请输入 URL', false); return; }
    let r = await api('add', 'POST', 'alias=' + encodeURIComponent(alias) + '&url=' + encodeURIComponent(url));
    if (r.error) { toast(r.error, false); return; }
    toast('订阅已添加', true);
    input.value = '';
    aliasInput.value = '';
    loadSubs();
}

// 修改别名（留空即清除）
async function renSub(btn) {
    let url = btn.dataset.url;
    let cur = btn.dataset.alias || '';
    let alias = prompt('设置别名（留空清除）：', cur);
    if (alias === null) return;
    let r = await api('rename', 'POST', 'alias=' + encodeURIComponent(alias.trim()) + '&url=' + encodeURIComponent(url));
    if (r.error) { toast(r.error, false); return; }
    toast('别名已更新', true);
    loadSubs();
}

// 删除订阅
async function delSub(btn) {
    let url = btn.dataset.url;
    let r = await api('delete', 'POST', 'url=' + encodeURIComponent(url));
    if (r.error) { toast(r.error, false); return; }
    toast('订阅已删除', true);
    loadSubs();
}

// 启用/停用订阅（可多选，刷新后生效）
async function toggleSub(url, enabled) {
    let r = await api('toggle', 'POST', 'url=' + encodeURIComponent(url) + '&enabled=' + (enabled ? '1' : '0'));
    if (r.error) { toast(r.error, false); return; }
    toast(enabled ? '已启用，刷新后生效' : '已停用，刷新后生效', true);
    loadSubs();
}

// Verge 式切换：只启用这一个订阅并刷新（配置整体替换为该订阅的节点/组/规则）
async function soloSub(url) {
    let r = await api('solo', 'POST', 'url=' + encodeURIComponent(url));
    if (r.error) { toast(r.error, false); return; }
    await api('refresh');
    toast('已切换，正在刷新…', true);
    loadSubs();
    pollRefresh(30);
}

// 设置调度
async function setSchedule(val) {
    let r = await api('schedule', 'POST', 'schedule=' + val);
    if (r.error) { toast(r.error, false); return; }
    let schMap = { '15min': '每 15 分钟', 'hourly': '每小时', 'daily': '每天' };
    document.getElementById('scheduleDisplay').textContent = schMap[val];
    // 更新选中状态
    document.querySelectorAll('.schedule-opt').forEach(el => {
        el.classList.toggle('active', el.dataset.val === val);
    });
    toast('调度已更新', true);
}

let refreshTimer = null;

// 手动刷新
async function doRefresh() {
    let btn = document.getElementById('refreshBtn');
    let icon = document.getElementById('refreshIcon');
    if (btn.disabled) return;

    btn.disabled = true;
    btn.classList.add('refreshing');
    icon.classList.add('spin');
    btn.querySelector('.btn-text').textContent = ' 刷新中...';

    let r = await api('refresh');
    if (r.error) {
        toast(r.error, false);
        btn.disabled = false;
        btn.classList.remove('refreshing');
        icon.classList.remove('spin');
        btn.querySelector('.btn-text').textContent = ' 立即刷新';
        return;
    }
    toast('刷新已触发，请稍后查看日志', true);
    // 轮询等待刷新完成，最多 60 秒
    let tries = 0;
    let poller = setInterval(async () => {
        tries++;
        await loadLogs();
        await loadStatus();
        await loadUsage();
        if (tries >= 60) {
            clearInterval(poller);
            finishRefresh(btn, icon);
        }
    }, 1000);
}

function finishRefresh(btn, icon) {
    btn.classList.remove('refreshing');
    icon.classList.remove('spin');
    btn.querySelector('.btn-text').textContent = ' 刷新完成';
    toast('刷新完成', true);
    // 30 秒冷却
    let cd = 30;
    let timer = setInterval(() => {
        cd--;
        btn.querySelector('.btn-text').textContent = ' ' + cd + 's 后可刷新';
        if (cd <= 0) {
            clearInterval(timer);
            btn.disabled = false;
            btn.querySelector('.btn-text').textContent = ' 立即刷新';
        }
    }, 1000);
}

// 打开面板
function openPanel() {
    window.open('//' + window.location.hostname + ':9090/ui', '_blank');
}

// 加载日志
async function loadLogs() {
    let data = await api('logs');
    let viewer = document.getElementById('logViewer');
    if (!data.logs || data.logs.length === 0) {
        viewer.textContent = '暂无日志';
        return;
    }
    viewer.textContent = data.logs.join('\n');
    viewer.scrollTop = viewer.scrollHeight;
}

// 加载当前调度选中状态
async function loadSchedule() {
    let data = await api('schedule');
    let cur = data.schedule || 'daily';
    document.querySelectorAll('.schedule-opt').forEach(el => {
        el.classList.toggle('active', el.dataset.val === cur);
    });
}

// 多账号合并方式
function updateGroupModeHint(mode) {
    document.getElementById('groupModeHint').textContent = mode === 'isolate'
        ? '各账号的策略组独立（组名带「别名 | 」前缀），规则分别指向各自账号的组；切换后自动刷新'
        : '同名策略组合并，多账号的节点共用一个组，规则去重只留一份；切换后自动刷新';
}

async function loadGroupMode() {
    let data = await api('groupmode');
    let cur = data.mode === 'isolate' ? 'isolate' : 'merge';
    document.querySelectorAll('#groupModeOpts .schedule-opt').forEach(el => {
        el.classList.toggle('active', el.dataset.val === cur);
    });
    updateGroupModeHint(cur);
}

async function setGroupMode(val) {
    let r = await api('groupmode', 'POST', 'mode=' + val);
    if (r.error) { toast(r.error, false); return; }
    document.querySelectorAll('#groupModeOpts .schedule-opt').forEach(el => {
        el.classList.toggle('active', el.dataset.val === val);
    });
    updateGroupModeHint(val);
    await api('refresh');
    toast('模式已切换，正在刷新…', true);
    pollRefresh(30);
}

// TUN 全局代理（每次刷新都会按这个开关重新生成配置）
function updateTunHint(mode, prereq, note, locked, runtime) {
    let msgs = [];
    msgs.push(mode === 'on' ? 'TUN 已开启：整机流量自动走代理，已自动排除本机 DNS' : 'TUN 已关闭：仅 7890 端口代理');
    if (prereq === false) msgs.push('⚠️ 容器缺少 /dev/net/tun 或 NET_ADMIN，需在 compose 添加后重建容器');
    if (runtime && runtime !== mode) {
        msgs.push('⚠️ 当前运行状态（' + (runtime === 'on' ? '开启' : '关闭') + '）与设置不一致，可能刚在 9090 面板改过；下次刷新会恢复为本页设置');
    }
    if (note) msgs.push((locked ? '🔒 ' : 'ℹ️ ') + note);
    msgs.push('切换后自动刷新；9090 面板的 TUN 开关仅临时生效，刷新后以本页为准');
    document.getElementById('tunModeHint').textContent = msgs.join('；');
}

async function loadTunMode() {
    let data = await api('tunmode');
    let cur = data.mode === 'on' ? 'on' : 'off';
    let locked = data.locked === true;
    document.querySelectorAll('#tunModeOpts .schedule-opt').forEach(el => {
        el.classList.toggle('active', el.dataset.val === cur);
        el.classList.toggle('disabled', locked);
    });
    updateTunHint(cur, data.prereq, data.note, locked, data.runtime);
}

async function setTunMode(val) {
    if (document.querySelector('#tunModeOpts .schedule-opt.disabled')) return;
    let r = await api('tunmode', 'POST', 'mode=' + val);
    if (r.error) { toast(r.error, false); return; }
    document.querySelectorAll('#tunModeOpts .schedule-opt').forEach(el => {
        el.classList.toggle('active', el.dataset.val === val);
    });
    await api('refresh');
    toast('TUN 已' + (val === 'on' ? '开启' : '关闭') + '，正在刷新…', true);
    setTimeout(loadTunMode, 1500);
    pollRefresh(30);
}

// 触发后台刷新后轮询日志/状态，让用户看到刷新进度（最多 seconds 秒）
function pollRefresh(seconds) {
    let n = 0;
    let t = setInterval(async () => {
        n++;
        await loadLogs();
        await loadStatus();
        if (n >= seconds) clearInterval(t);
    }, 1000);
}

// 回车添加订阅
document.getElementById('subInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addSub();
});
document.getElementById('aliasInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addSub();
});

// 初始加载
loadStatus();
loadSubs();
loadLogs();
loadSchedule();
loadGroupMode();
loadTunMode();
</script>
</body>
